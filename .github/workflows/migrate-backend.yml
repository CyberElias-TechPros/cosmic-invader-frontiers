name: Migrate backend

# Applies outstanding D1 migrations (backend/migrations/*.sql) to the live
# cosmic-invader-frontiers database on push to main (Cyber account), so new
# migration files ship automatically. This workflow does NOT deploy the
# worker (backend deploys are manual until the wrangler config is finalized).
# Requires repo secrets CF_API_TOKEN + CF_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - "backend/migrations/**"
      - "backend/wrangler.toml"
      - ".github/workflows/migrate-backend.yml"
  workflow_dispatch:

concurrency:
  group: migrate-backend
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CF_API_TOKEN / CF_ACCOUNT_ID repo secrets (Cyber account)."
            exit 1
          fi
      - name: Apply D1 migrations
        run: npx -y wrangler@latest d1 migrations apply cosmic-invader-frontiers --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
