name: Deploy backend

# Deploys the cosmic-invader-frontiers-api worker on push to main (Cyber
# account, cyber-e54). Applies outstanding D1 migrations
# (backend/migrations/*.sql) before every deploy, so new migration files ship
# automatically with the code that needs them. Worker secret SESSION_SECRET
# must exist (set once via `wrangler secret put`); this workflow never
# touches it.
# Requires repo secrets CF_API_TOKEN + CF_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CF_API_TOKEN / CF_ACCOUNT_ID repo secrets (Cyber account)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Apply D1 migrations
        working-directory: backend
        run: npx wrangler d1 migrations apply cosmic-invader-frontiers --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      - name: Deploy Worker
        working-directory: backend
        run: npx wrangler deploy
      - name: Verify health
        run: |
          body="$(curl -fsS https://cosmic-invader-frontiers-api.cyber-e54.workers.dev/api/v1/health)"
          echo "$body"
          echo "$body" | grep -q '"ok":true' || {
            echo "::error::cosmic-invader-frontiers-api health check failed"; exit 1; }
